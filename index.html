<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astra Mining Agent</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Üst Durum Çubuğu -->
        <header class="top-bar">
            <div class="balance-container">
                <span class="currency-symbol">$</span>
                <span id="usd-balance" class="balance-text">0.0012</span>
                <span class="currency-code">USD</span>
            </div>
            <div class="top-actions">
                <!-- Dil Seçim Alanı -->
                <div class="language-selector" id="lang-selector">
                    <span id="current-flag" class="active-flag">🇹🇷</span>
                    <div class="lang-dropdown" id="lang-dropdown">
                        <div class="lang-option" data-lang-opt="tr">🇹🇷 TR</div>
                        <div class="lang-option" data-lang-opt="en">🇺🇸 EN</div>
                    </div>
                </div>
                <button class="settings-btn"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <!-- Ana İçerik Alanı -->
        <main class="main-content">
            <div class="agent-display">
                <div class="robot-container">
                    <i class="fas fa-robot robot-placeholder-icon"></i>
                </div>
                <button class="action-arrow-btn"><i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="timer-display" id="mining-timer">06:51:25</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label" data-lang="token">Token</span>
                    <span id="token-count" class="stat-value">49.5766</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label" data-lang="power">Güç</span>
                    <span id="power-amount" class="stat-value">2 110</span>
                </div>
            </div>

            <div class="actions-group">
                <button class="btn btn-blue" id="btn-sell-token" data-lang="sell_btn">TOKEN SAT</button>
                <button class="btn btn-purple" id="btn-upgrade-agent" data-lang="upgrade_btn">AGENT'I YÜKSELT</button>
            </div>

            <div class="ai-chat-bar">
                <div class="ai-chat-left">
                    <i class="fas fa-brain ai-icon"></i>
                    <span data-lang="ai_title">AI Agent'ınız</span>
                </div>
                <button class="chat-sohbet-btn" data-lang="chat_btn">Sohbet</button>
            </div>

            <div class="referral-box">
                <div class="ref-info">
                    <i class="fas fa-users ref-icon"></i>
                    <div class="ref-text">
                        <span class="ref-title" id="ref-title-text" data-lang="ref_title">1 arkadaşınızı davet edin</span>
                        <span class="ref-reward" id="ref-reward-text" data-lang="ref_reward">+200 Güç</span>
                    </div>
                </div>
                <div class="ref-status" id="ref-count-status">0/1</div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="upgrade">
                <i class="fas fa-bolt"></i>
                <span data-lang="nav_upgrade">Yükselt</span>
            </button>
            <button class="nav-item" data-target="earn">
                <i class="fas fa-dollar-sign"></i>
                <span data-lang="nav_earn">Kazan</span>
            </button>
            <button class="nav-item" data-target="ai">
                <i class="fas fa-microchip"></i>
                <span data-lang="nav_ai">AI</span>
            </button>
            <button class="nav-item" data-target="tasks">
                <i class="fas fa-tasks"></i>
                <span data-lang="nav_tasks">Görevler</span>
            </button>
            <button class="nav-item" data-target="payment">
                <i class="fas fa-wallet"></i>
                <span data-lang="nav_pay">Ödeme</span>
            </button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
